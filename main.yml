name: Mailer NFC Automático

on:
  repository_dispatch:
    types: ["lanzar_correos"]
  workflow_dispatch:

jobs:
  enviar_correos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar los archivos
        uses: actions/checkout@v3
        
      - name: Instalar Python con Caché
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # <--- Esto guarda Supabase en la memoria de Microsoft
          
      - name: Instalar librerías ultrarrápido
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: Ejecutar Script de Ventas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMAIL_ORIGEN: ${{ secrets.EMAIL_ORIGEN }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python -u mailer_nfc.py
